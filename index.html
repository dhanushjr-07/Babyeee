<!DOCTYPE html>
<html>
<head>
  <title>For My Baby ❤️</title>
  <style>
    body {
      text-align: center;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-top: 100px;
      color: #fff;
      font-size: 32px;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 20px;
    }
    #yes {
      background-color: #4CAF50;
      color: white;
    }
    #no {
      background-color: #ff4d4d;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>
  <h1>Hey baby 😘<br>Will you be my Valentine? 💕</h1>

  <button id="yes" onclick="yesClick()">YES 🥰</button>
  <button id="no" onmouseover="moveNo()">NO 😏</button>

  <script>
    function yesClick() {
      document.body.innerHTML = `
        <h1>YAYYY 😍💖<br>
        I knew you’d say YES, baby 🥹❤️<br><br>
        Yours forever,<br>
        — Dhanush 😌✨</h1>`;
    }

    function moveNo() {
      let x = Math.random() * (window.innerWidth - 100);
      let y = Math.random() * (window.innerHeight - 100);
      document.getElementById("no").style.left = x + "px";
      document.getElementById("no").style.top = y + "px";
    }
  </script>
</body>
</html>
