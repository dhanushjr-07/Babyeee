<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        body {
            background-color: #ffe4e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container { z-index: 10; }
        h1 { color: #d42e70; font-size: 2rem; }
        #main-img { width: 200px; border-radius: 15px; margin-bottom: 20px; }
        .buttons { display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 20px; }
        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn { background-color: #ff69b4; color: white; }
        #noBtn { background-color: #ffffff; color: #d42e70; position: absolute; }
        .heart {
            position: absolute;
            color: rgba(212, 46, 112, 0.4);
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <img id="main-img" src="https://media.tenor.com/2X9t6_pT6pMAAAAi/peach-goma.gif">
        <h1>Will you be my Valentine? 💖</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES! 😍</button>
            <button id="noBtn" onmouseover="moveNo()">No 🙄</button>
        </div>
    </div>
    <script>
        let yesSize = 1;
        function moveNo() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            document.getElementById('noBtn').style.left = x + 'px';
            document.getElementById('noBtn').style.top = y + 'px';
            yesSize += 0.4;
            document.getElementById('yesBtn').style.transform = `scale(${yesSize})`;
        }
        function celebrate() {
            document.querySelector('.container').innerHTML = `
                <img id="main-img" src="https://media.tenor.com/O6S9E9zY_p8AAAAi/peach-goma-love.gif">
                <h1>YAYYY! See you on the 14th! 😘💕</h1>
            `;
        }
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-5vh';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
